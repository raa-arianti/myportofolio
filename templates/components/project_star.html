{# Tombol star satu proyek. Pengunjung yang belum login tetap melihatnya, #}
{# dan saat ditekan akan diarahkan ke halaman login oleh @login_required. #}
<form method="post" action="{% url 'main:toggle_star' project.id %}" class="star-form">
    {% csrf_token %}
    <button type="submit"
            class="button-star{% if user in project.starred_by.all %} is-starred{% endif %}"
            title="{% if project.starred_by.all %}Starred by {{ project.starred_by.all|join:', ' }}{% else %}Be the first to star this project{% endif %}">
        <span aria-hidden="true">&#9733;</span>
        {% if user in project.starred_by.all %}Unstar{% else %}Star{% endif %}
        <span class="star-count">{{ project.starred_by.count }}</span>
    </button>
</form>

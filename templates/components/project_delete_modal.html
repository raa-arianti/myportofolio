{# Tombol hapus di pojok kartu dan dialog konfirmasinya. #}
{# Memakai atribut popover bawaan HTML, jadi tidak butuh JavaScript. #}
<button type="button"
        class="card-action"
        popovertarget="delete-project-{{ project.id }}"
        aria-label="Delete {{ project.title }}">
    Delete
</button>

<div id="delete-project-{{ project.id }}"
     class="delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-project-title-{{ project.id }}">
    <button type="button"
            class="delete-modal-backdrop"
            popovertarget="delete-project-{{ project.id }}"
            popovertargetaction="hide"
            aria-label="Close delete confirmation"></button>

    <div class="delete-modal-content">
        <h2 id="delete-project-title-{{ project.id }}">Delete project?</h2>
        <p>
            Are you sure you want to delete <strong>{{ project.title }}</strong>?
            This cannot be undone.
        </p>
        <div class="delete-modal-actions">
            <button type="button"
                    class="button button-secondary"
                    popovertarget="delete-project-{{ project.id }}"
                    popovertargetaction="hide">Cancel</button>
            <form method="post" action="{% url 'main:delete_project' project.id %}">
                {% csrf_token %}
                <button type="submit" class="button button-danger">Yes, delete</button>
            </form>
        </div>
    </div>
</div>

{% load static %}
{# Notifikasi singkat yang muncul di pojok kanan bawah lalu hilang sendiri. #}
{# popover="manual" menaruhnya di top layer browser, jadi selalu di atas elemen lain. #}
<div id="toast-component" class="toast-component toast-hidden" popover="manual">
    <div class="toast-content">
        <h3 id="toast-title" class="toast-title"></h3>
        <p id="toast-message" class="toast-message"></p>
    </div>
</div>

<script src="{% static 'js/toast.js' %}"></script>
